@if (profile_data) {
<div class="min-h-screen bg-white text-black flex">
  <!-- Sidebar -->
  <aside class="w-72 bg-white text-black p-10 hidden md:flex flex-col justify-between border-r border-gray-200">
    <div>
      <h1 class="text-3xl font-bold mb-12 tracking-tight">Settings</h1>
      <nav class="space-y-4">
        <a href="#" class="block px-5 py-3 rounded-xl bg-black text-white text-sm font-semibold">Public profile</a>
        <a href="#" class="block px-5 py-3 rounded-xl text-sm font-medium hover:bg-gray-100 transition">Account
          settings</a>
        <a href="#"
          class="block px-5 py-3 rounded-xl text-sm font-medium hover:bg-gray-100 transition">Notifications</a>
        <a href="#"
          class="block px-5 py-3 rounded-xl text-sm font-semibold uppercase tracking-wider border border-black">Pro
          Account</a>
      </nav>
    </div>
    <p class="text-xs text-gray-400">© 2026</p>
  </aside>

  <!-- Main -->
  <main class="flex-1 p-8 md:p-16 bg-white">
    <header class="mb-12 border-b border-gray-200 pb-6">
      <h2 class="text-4xl font-bold tracking-tight">Public profile</h2>
      <p class="text-gray-500 mt-2 text-sm">Manage your personal information</p>
    </header>

    <div class="max-w-4xl mx-auto">
      <!-- Profile Image -->
      <div class="flex items-center gap-10 mb-16">
        <div class="relative">
          <div class="w-36 h-36 rounded-full overflow-hidden border border-gray-200">
            <img
              src="https://ui-avatars.com/api/?name={{profile_data.first_name}}+{{profile_data.last_name}}&background=000000&color=ffffff&size=128"
              alt="Profile" class="w-full h-full object-cover">
          </div>
        </div>

        <div class="flex flex-col gap-3">
          <button class="bg-black text-white px-6 py-2.5 rounded-lg text-sm font-semibold hover:scale-105 transition">
            Change picture
          </button>
          <button
            class="border border-gray-300 px-6 py-2.5 rounded-lg text-sm font-semibold hover:bg-black hover:text-white transition">
            Delete picture
          </button>
        </div>
      </div>

      <!-- Info Grid -->
      <form class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="space-y-2">
          <label class="text-xs uppercase tracking-widest text-gray-500">First name</label>
          <input type="text" [(ngModel)]="profile_data.first_name" name="first_name" placeholder="Enter your first name"
            class="w-full p-4 border border-gray-200 rounded-xl bg-gray-50 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-black/20" />
        </div>

        <div class="space-y-2">
          <label class="text-xs uppercase tracking-widest text-gray-500">Last name</label>
          <input type="text" [(ngModel)]="profile_data.last_name" name="last_name" placeholder="Enter your last name"
            class="w-full p-4 border border-gray-200 rounded-xl bg-gray-50 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-black/20" />
        </div>

        <div class="md:col-span-2 space-y-2">
          <label class="text-xs uppercase tracking-widest text-gray-500">Email address</label>
          <div class="flex gap-4 items-center">
            <input type="email" [(ngModel)]="profile_data.email" name="email" placeholder="Enter your email"
              class="flex-1 p-4 border border-gray-200 rounded-xl bg-gray-50 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-black/20" />
            <span
              class="text-xs px-3 py-1 border border-black rounded-full uppercase tracking-widest whitespace-nowrap">
              {{ profile_data.role }}
            </span>
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-xs uppercase tracking-widest text-gray-500">Phone number</label>
          <input type="text" [(ngModel)]="profile_data.phone_number" name="phone_number"
            placeholder="Enter your phone number"
            class="w-full p-4 border border-gray-200 rounded-xl bg-gray-50 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-black/20" />
        </div>

        <div class="space-y-2">
          <label class="text-xs uppercase tracking-widest text-gray-500">Account status</label>
          <div class="p-4 border border-gray-200 rounded-xl flex items-center gap-3 bg-gray-50">
            <span class="h-2.5 w-2.5 rounded-full" [class]="profile_data.is_active ? 'bg-black' : 'bg-gray-400'"></span>
            <span class="text-sm tracking-wide" [class]="profile_data.is_active ? 'text-black' : 'text-gray-500'">
              {{ profile_data.is_active ? 'Active Account' : 'Inactive' }}
            </span>
          </div>
        </div>

        <!-- Save Button -->
        <div class="md:col-span-2 flex justify-end pt-6">
          <button type="button" (click)="onUpdateProfile()"
            class="bg-black text-white px-8 py-3 rounded-xl text-sm font-semibold hover:scale-105 transition">
            Save changes
          </button>
        </div>
      </form>
    </div>
  </main>
</div>
} @else {
<div class="flex flex-col justify-center items-center h-screen bg-white">
  <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-black mb-4"></div>
  <p class="text-black font-light tracking-widest uppercase text-sm">Loading Profile</p>
</div>
}
